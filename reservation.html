<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réservation — LCP Horizon International</title>
<link rel="icon" href="assets/images/lcp-horizon-logo.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="assets/images/lcp-horizon-logo.svg" alt="LCP Horizon International">
      <span class="brand-text"><strong>LCP Horizon</strong><span>International</span></span>
    </a>
    <nav class="main-nav">
      <a href="index.html#destinations">Destinations</a>
      <a href="reservation.html">Réservation</a>
      <a href="produits-naturels/index.html">Produits naturels</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <a href="reservation.html" class="nav-cta">Réserver un vol</a>
  </div>
</header>

<section class="section">
  <div class="container" style="max-width:760px;">
    <div class="section-head">
      <span class="eyebrow">Réservation</span>
      <h2>Réservez votre vol</h2>
      <p>Choisissez une destination de notre catalogue, ou décrivez votre demande si votre trajet n'y figure pas.</p>
    </div>

    <div class="mode-toggle" id="mode-toggle">
      <button type="button" class="active" data-mode="direct">Réservation directe</button>
      <button type="button" data-mode="demande">Demande sur-mesure</button>
    </div>

    <form id="booking-form" class="form-card">

      <!-- Bloc réservation directe -->
      <div id="mode-direct">
        <div class="form-row full">
          <div class="field">
            <label for="vol">Destination</label>
            <select id="vol" name="vol">
              <option value="">Chargement des vols…</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Bloc demande sur-mesure -->
      <div id="mode-demande" style="display:none;">
        <div class="form-row">
          <div class="field">
            <label for="depart">Ville de départ</label>
            <input type="text" id="depart" name="depart" placeholder="Ex. Bouaké">
          </div>
          <div class="field">
            <label for="arrivee">Ville d'arrivée</label>
            <input type="text" id="arrivee" name="arrivee" placeholder="Ex. Le Caire">
          </div>
        </div>
        <div class="form-row full">
          <div class="field">
            <label for="details">Détails de la demande</label>
            <textarea id="details" name="details" rows="3" placeholder="Dates flexibles, nombre de personnes, contraintes particulières…"></textarea>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="type-trajet">Type de trajet</label>
          <select id="type-trajet" name="typeTrajet">
            <option value="aller-simple">Aller simple</option>
            <option value="aller-retour">Aller-retour</option>
          </select>
        </div>
        <div class="field">
          <label for="classe">Classe</label>
          <select id="classe" name="classe">
            <option value="economique">Économique</option>
            <option value="affaires">Affaires</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="date-aller">Date aller</label>
          <input type="date" id="date-aller" name="dateAller" required>
        </div>
        <div class="field" id="champ-date-retour">
          <label for="date-retour">Date retour</label>
          <input type="date" id="date-retour" name="dateRetour">
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="passagers">Nombre de passagers</label>
          <input type="number" id="passagers" name="passagers" min="1" value="1" required>
        </div>
        <div class="field"></div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" required>
        </div>
        <div class="field">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" required>
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="telephone">Téléphone</label>
          <input type="tel" id="telephone" name="telephone" required placeholder="+225 ...">
        </div>
      </div>

      <div id="form-feedback" style="margin:14px 0; font-size:0.88rem;"></div>

      <button type="submit" class="btn-primary" style="width:100%; margin-top:8px;">Envoyer ma réservation</button>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 LCP Horizon International</span>
      <span>Bouaké, Côte d'Ivoire</span>
    </div>
  </div>
</footer>

<script type="module" src="assets/js/firebase-config.js"></script>
<script type="module" src="assets/js/booking.js"></script>
</body>
</html>
