<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CD86"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#9C7A2E"/>
    </linearGradient>
    <linearGradient id="navy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132A4C"/>
      <stop offset="100%" stop-color="#0A1930"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="640" fill="#F7F4EC"/>

  <!-- Outer ring -->
  <circle cx="320" cy="300" r="200" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="320" cy="300" r="190" fill="url(#navy)"/>
  <circle cx="320" cy="300" r="190" fill="none" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- Horizon line -->
  <path d="M 150 340 A 170 170 0 0 1 490 340" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.55"/>
  <line x1="165" y1="360" x2="475" y2="360" stroke="url(#gold)" stroke-width="1" opacity="0.35"/>

  <!-- Rising sun / horizon arcs -->
  <path d="M 210 360 A 110 110 0 0 1 430 360" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>

  <!-- Stylized aircraft silhouette climbing over horizon -->
  <g transform="translate(320,280) rotate(-18)">
    <path d="
      M -95 6
      L -25 6
      L 5 -34
      L 22 -34
      L 4 6
      L 38 6
      L 58 -12
      L 74 -12
      L 62 6
      L 96 6
      L 108 16
      L 62 16
      L 78 44
      L 62 44
      L 34 16
      L -10 16
      L -22 40
      L -38 40
      L -30 16
      L -95 16
      Z"
      fill="url(#gold)"/>
  </g>

  <!-- Fine compass ticks -->
  <g stroke="url(#gold)" stroke-width="1" opacity="0.6">
    <line x1="320" y1="118" x2="320" y2="134"/>
    <line x1="320" y1="466" x2="320" y2="482"/>
    <line x1="138" y1="300" x2="154" y2="300"/>
    <line x1="486" y1="300" x2="502" y2="300"/>
  </g>

  <!-- Wordmark -->
  <text x="320" y="440" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="42" letter-spacing="6" fill="#F7F4EC">LCP HORIZON</text>
  <text x="320" y="475" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="22" letter-spacing="10" fill="url(#gold)">INTERNATIONAL</text>

  <!-- Divider -->
  <line x1="255" y1="452" x2="385" y2="452" stroke="url(#gold)" stroke-width="1"/>
</svg>
